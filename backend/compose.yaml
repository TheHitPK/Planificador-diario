# Base de datos local para desarrollo.
# Puerto 5433 en el host para no chocar con un PostgreSQL instalado localmente en 5432.
# Uso:  docker compose up -d     (desde la carpeta backend/)
services:
  postgres:
    image: postgres:17-alpine
    container_name: planificacion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-planificacion}
      POSTGRES_USER: ${DB_USER:-planificacion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-planificacion}
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
