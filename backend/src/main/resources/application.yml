spring:
  application:
    name: planificacion-api
  profiles:
    default: dev
  datasource:
    # DB_URL (JDBC completo, p. ej. Neon/Supabase con ?sslmode=require) tiene prioridad sobre DB_HOST/DB_PORT/DB_NAME.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:planificacion}}
    username: ${DB_USER:planificacion}
    password: ${DB_PASSWORD:planificacion}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # El esquema lo gestiona Flyway, Hibernate solo lo valida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Clave HMAC en Base64 (mínimo 32 bytes). Obligatoria fuera del perfil dev.
    secret: ${JWT_SECRET}
    issuer: planificacion-api
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    # Orígenes separados por comas, p. ej. CORS_ALLOWED_ORIGINS=https://mi-app.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rates:
    base-url: https://ve.dolarapi.com
  mail:
    # Los enlaces de los correos apuntan aquí (la app web).
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    # En Brevo, este remitente debe estar verificado (Senders & IP > Senders).
    from-email: ${MAIL_FROM:no-reply@planificacion.local}
    from-name: ${MAIL_FROM_NAME:Planificación diaria}
    # Sin clave, los correos no se envían: se escriben en el log (útil en desarrollo).
    brevo-api-key: ${BREVO_API_KEY:}
    verification-ttl: 24h
    password-reset-ttl: 1h
    resend-cooldown: 60s
